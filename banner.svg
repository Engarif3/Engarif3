<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g id="wave-back">
    <path d="M0,235 C220,190 380,275 640,230 C860,190 1000,265 1200,210 L1200,300 L0,300 Z" fill="url(#wave1)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </g>

  <g id="wave-front">
    <path d="M0,265 C260,225 460,290 700,258 C920,228 1040,285 1200,252 L1200,300 L0,300 Z" fill="#ffffff" fill-opacity="0.10"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="#ffffff" opacity="0">
    Md Arifur Rahman
    <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0s" fill="freeze"/>
  </text>
  <text x="600" y="188" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" fill="#E6FBF8" opacity="0">
    Full-Stack &amp; Mobile Developer — React · React Native · Node.js
    <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.35s" fill="freeze"/>
  </text>
</svg>
